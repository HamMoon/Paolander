<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paohan</title>
<style>
  @font-face {
    font-family: 'm6x11plus';
    src: url('assets/font-m6x11plus.ttf') format('truetype');
    font-display: swap;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: #0d0f1a;
    overflow: hidden;
    font-family: 'm6x11plus', 'Courier New', monospace;
  }

  img, canvas, #bg-gif {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }

  #page-1 {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  #bg-gif {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('assets/fondo_cielo_estrellado.gif');
    background-repeat: repeat;
    background-size: 676px 766px;
    background-position: center;
  }

  /* ---------- Countdown (siempre visible, en todas las pantallas) ---------- */

  #countdown {
    position: absolute;
    top: 5%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    text-align: center;
    color: #e8f0ff;
  }

  #countdown-label {
    font-size: 16px;
    letter-spacing: 5px;
    text-shadow: 0 0 10px rgba(150,180,255,0.5);
    margin-bottom: 6px;
  }

  #countdown-timer {
    display: flex;
    gap: 14px;
    justify-content: center;
  }

  .cd-block {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .cd-value {
    font-size: 22px;
    color: #ffffff;
    text-shadow: 0 0 8px rgba(150,180,255,0.6);
  }

  .cd-unit {
    font-size: 10px;
    letter-spacing: 2px;
    color: #aab4d0;
    margin-top: 2px;
  }

  /* ---------- Sistema de pantallas ---------- */

  .screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
  }
  .screen.active {
    display: block;
  }

  /* ---------- Botón "volver" (casita) ---------- */

  #back-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
    width: 48px;
    height: 48px;
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    display: none;
  }
  #back-btn img {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 0 6px rgba(0,0,0,0.5));
  }
  #back-btn.show {
    display: block;
  }
  #back-btn:hover { filter: brightness(1.15); }

  /* ---------- Pantalla 1: Menú ---------- */

  #nav-buttons {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
    z-index: 2;
  }

  .nav-btn {
    width: 260px;
    height: 64px;
    background: transparent;
    border-style: solid;
    border-width: 10px 14px;
    border-image-source: url('assets/ui/btn-principal.png');
    border-image-slice: 20 fill;
    border-image-width: 10px 14px;
    border-image-repeat: stretch;
    color: #ffffff;
    font-family: 'm6x11plus', 'Courier New', monospace;
    font-size: 22px;
    letter-spacing: 2px;
    cursor: pointer;
    text-shadow: 0 2px 2px rgba(0,0,0,0.4);
  }
  .nav-btn:hover { filter: brightness(1.1); }
  .nav-btn:active { filter: brightness(0.9); }

  /* ---------- Pantalla 2: Inicio ---------- */

  #avatar-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 2;
  }

  #avatar-box {
    position: relative;
  }

  #avatar {
    width: 180px;
    height: auto;
    filter: drop-shadow(0 0 12px rgba(255,255,255,0.15));
  }

  #title {
    margin-top: 1rem;
    color: #e8f0ff;
    font-size: 22px;
    letter-spacing: 6px;
    text-shadow: 0 0 10px rgba(150,180,255,0.5);
  }

  #avion {
    position: absolute;
    top: 50%;
    right: 8%;
    transform: translateY(-50%);
    width: 130px;
    height: auto;
    z-index: 2;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.15));
  }

  #bubble {
    position: absolute;
    top: 2px;
    left: -28px;
    width: 56px;
    height: auto;
    opacity: 0;
    transform: translateY(6px) scale(0.9);
    transition: opacity 0.35s ease, transform 0.35s ease;
    pointer-events: none;
  }
  #bubble.show {
    opacity: 1;
    transform: translateY(0px) scale(1);
  }

  /* ---------- Pantalla 3: Música ---------- */

  #player-panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(440px, 92vw);
    z-index: 2;
    border-style: solid;
    border-width: 26px 20px 24px 20px;
    border-image-source: url('assets/player/player-panel.png');
    border-image-slice: 75 59 71 60 fill;
    border-image-width: 26px 20px 24px 20px;
    border-image-repeat: stretch;
    padding: 26px 22px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #track-cover-wrap {
    width: 130px;
    height: 130px;
    border: 3px solid #6b1410;
    box-shadow: 0 0 14px rgba(200,40,30,0.35);
    overflow: hidden;
    background: #1a0d10;
    flex-shrink: 0;
  }
  #track-cover {
    width: 100%;
    height: 100%;
    object-fit: cover;
    image-rendering: auto; /* las portadas son fotos, no pixel art */
  }

  #track-info {
    text-align: center;
    color: #f3e6e6;
    margin-top: 12px;
    min-height: 54px;
    max-width: 100%;
  }
  #track-title {
    font-size: 15px;
    letter-spacing: 1px;
    color: #ffffff;
    text-shadow: 0 0 6px rgba(220,60,50,0.5);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 320px;
  }
  #track-artist {
    font-size: 11px;
    color: #d79a94;
    margin-top: 4px;
    letter-spacing: 1px;
  }
  #track-album {
    font-size: 9px;
    color: #9c6c68;
    margin-top: 2px;
    letter-spacing: 1px;
  }

  #progress-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    margin-top: 14px;
  }
  .time-label {
    font-size: 9px;
    color: #c99490;
    min-width: 28px;
    text-align: center;
  }
  #progress-bar {
    position: relative;
    flex: 1;
    height: 20px;
    cursor: pointer;
  }
  #progress-bar img, #progress-fill-wrap img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }
  #progress-fill-wrap {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 0%;
    overflow: hidden;
  }
  #progress-fill-wrap img {
    width: var(--bar-real-width, 300px);
    max-width: none;
  }

  #player-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 16px;
  }

  .player-btn {
    width: 42px;
    height: 42px;
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .player-btn img {
    width: 100%;
    height: 100%;
    display: block;
  }
  .player-btn:hover { filter: brightness(1.15); }
  .player-btn:active { filter: brightness(0.9); }
  .player-btn.active { filter: drop-shadow(0 0 6px rgba(255,120,100,0.9)); }

  #btn-play-pause {
    width: 52px;
    height: 52px;
  }

  #secondary-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 14px;
    width: 100%;
  }

  .player-btn.small {
    width: 30px;
    height: 30px;
  }

  #volume-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    max-width: 140px;
  }
  #volume-bar {
    position: relative;
    flex: 1;
    height: 14px;
    cursor: pointer;
  }
  #volume-bar img, #volume-fill-wrap img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }
  #volume-fill-wrap {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 50%;
    overflow: hidden;
  }
  #volume-fill-wrap img {
    width: var(--vol-bar-real-width, 150px);
    max-width: none;
  }

  /* ---------- Cajón de playlist ---------- */

  #playlist-drawer {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.95);
    width: min(440px, 92vw);
    max-height: 70vh;
    overflow-y: auto;
    z-index: 6;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #playlist-drawer.show {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
  }

  .playlist-item {
    position: relative;
    height: 54px;
    margin-bottom: 8px;
    border-style: solid;
    border-width: 12px 10px 11px 10px;
    border-image-source: url('assets/player/playlist-item-bg.png');
    border-image-slice: 28 20 25 20 fill;
    border-image-width: 12px 10px 11px 10px;
    border-image-repeat: stretch;
    display: flex;
    align-items: center;
    padding: 0 14px;
    cursor: pointer;
    color: #f0dcdc;
    font-size: 11px;
    gap: 10px;
  }
  .playlist-item:hover { filter: brightness(1.15); }
  .playlist-item.playing {
    filter: drop-shadow(0 0 8px rgba(255,90,70,0.7));
  }
  .playlist-item-cover {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    background: #1a0d10;
    object-fit: cover;
  }
  .playlist-item-text {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .playlist-item-title {
    display: block;
    color: #ffffff;
  }
  .playlist-item-artist {
    display: block;
    font-size: 9px;
    color: #c99490;
    margin-top: 2px;
  }

  /* ---------- Botón de sonido de fondo (persistente) ---------- */

  #sound-btn {
    position: absolute;
    bottom: 20px;
    right: 20px;
    z-index: 10;
    background: transparent;
    border-style: solid;
    border-width: 14px 20px;
    border-image-source: url('assets/button.png');
    border-image-slice: 50 fill;
    border-image-width: 14px 20px;
    border-image-repeat: stretch;
    image-rendering: pixelated;
    color: #2c2c2c;
    font-family: 'm6x11plus', 'Courier New', monospace;
    font-size: 14px;
    padding: 4px 6px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  #sound-btn:hover { filter: brightness(0.95); }
  #sound-btn:active { filter: brightness(0.88); }
</style>
</head>
<body>

<div id="page-1">
  <div id="bg-gif"></div>

  <div id="countdown">
    <div id="countdown-label">REENCUENTRO</div>
    <div id="countdown-timer">
      <div class="cd-block">
        <span class="cd-value" id="cd-days">--</span>
        <span class="cd-unit">DÍAS</span>
      </div>
      <div class="cd-block">
        <span class="cd-value" id="cd-hours">--</span>
        <span class="cd-unit">HORAS</span>
      </div>
      <div class="cd-block">
        <span class="cd-value" id="cd-minutes">--</span>
        <span class="cd-unit">MIN</span>
      </div>
      <div class="cd-block">
        <span class="cd-value" id="cd-seconds">--</span>
        <span class="cd-unit">SEG</span>
      </div>
    </div>
  </div>

  <button id="back-btn" title="Volver al menú"><img src="assets/ui/inicio_casita.png" alt="Volver"></button>

  <!-- ===== Pantalla 1: Menú ===== -->
  <div class="screen active" id="screen-menu">
    <div id="nav-buttons">
      <button class="nav-btn" data-target="inicio">Inicio</button>
      <button class="nav-btn" data-target="musica">Música</button>
    </div>
  </div>

  <!-- ===== Pantalla 2: Inicio ===== -->
  <div class="screen" id="screen-inicio">
    <img id="avion" src="assets/avion.png" alt="Avión pixel art">

    <div id="avatar-wrap">
      <div id="avatar-box">
        <img id="avatar" src="assets/avatar.png" alt="Avatar Paohan">
        <img id="bubble" src="" alt="">
      </div>
      <div id="title">PAOLA Y HANDER</div>
    </div>
  </div>

  <!-- ===== Pantalla 3: Música ===== -->
  <div class="screen" id="screen-musica">
    <div id="player-panel">
      <div id="track-cover-wrap">
        <img id="track-cover" src="" alt="Portada del álbum">
      </div>

      <div id="track-info">
        <div id="track-title">Selecciona una canción</div>
        <div id="track-artist"></div>
        <div id="track-album"></div>
      </div>

      <div id="progress-wrap">
        <span class="time-label" id="time-current">0:00</span>
        <div id="progress-bar">
          <img src="assets/player/progress-track.png" alt="">
          <div id="progress-fill-wrap"><img src="assets/player/progress-fill.png" alt=""></div>
        </div>
        <span class="time-label" id="time-duration">0:00</span>
      </div>

      <div id="player-controls">
        <button class="player-btn" id="btn-shuffle" title="Aleatorio">
          <img id="shuffle-icon" src="assets/player/btn-aleatory.png" alt="Aleatorio">
        </button>
        <button class="player-btn" id="btn-prev" title="Anterior">
          <img src="assets/player/btn-prev.png" alt="Anterior">
        </button>
        <button class="player-btn" id="btn-play-pause" title="Reproducir/Pausar">
          <img id="play-pause-icon" src="assets/player/btn-play.png" alt="Reproducir">
        </button>
        <button class="player-btn" id="btn-next" title="Siguiente">
          <img src="assets/player/btn-next.png" alt="Siguiente">
        </button>
        <button class="player-btn" id="btn-repeat" title="Repetir">
          <img id="repeat-icon" src="assets/player/btn-repetition.png" alt="Repetir">
        </button>
      </div>

      <div id="secondary-controls">
        <button class="player-btn small" id="btn-stop" title="Detener">
          <img src="assets/player/btn-stop.png" alt="Detener">
        </button>
        <div id="volume-wrap">
          <button class="player-btn small" id="btn-mute" title="Silenciar">
            <img id="volume-icon" src="assets/player/btn-volume-on.png" alt="Volumen">
          </button>
          <div id="volume-bar">
            <img src="assets/player/volume-track.png" alt="">
            <div id="volume-fill-wrap"><img src="assets/player/volume-fill.png" alt=""></div>
          </div>
        </div>
        <button class="player-btn small" id="btn-playlist-toggle" title="Lista de canciones">
          <img src="assets/player/btn-playlist.png" alt="Lista">
        </button>
      </div>
    </div>

    <div id="playlist-drawer"></div>
  </div>

  <button id="sound-btn">🔇 City of Stars</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="script.js?v=2"></script>
</body>
</html>
