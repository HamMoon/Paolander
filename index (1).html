<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paohan</title>
<style>
  @font-face {
    font-family: 'm6x11plus';
    src: url('assets/font-m6x11plus.ttf') format('truetype');
    font-display: swap;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: #0d0f1a;
    overflow: hidden;
    font-family: 'm6x11plus', 'Courier New', monospace;
  }

  img, canvas, #bg-gif {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }

  #page-1 {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  #bg-gif {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('assets/fondo_cielo_estrellado.gif');
    background-repeat: repeat;
    background-size: 676px 766px;
    background-position: center;
  }

  #avatar-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 2;
  }

  #avatar-box {
    position: relative;
  }

  #avatar {
    width: 180px;
    height: auto;
    filter: drop-shadow(0 0 12px rgba(255,255,255,0.15));
  }

  #title {
    margin-top: 1rem;
    color: #e8f0ff;
    font-size: 22px;
    letter-spacing: 6px;
    text-shadow: 0 0 10px rgba(150,180,255,0.5);
  }

  #avion {
    position: absolute;
    top: 50%;
    right: 8%;
    transform: translateY(-50%);
    width: 130px;
    height: auto;
    z-index: 2;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.15));
  }

  #countdown {
    position: absolute;
    top: 5%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    text-align: center;
    color: #e8f0ff;
  }

  #countdown-label {
    font-size: 16px;
    letter-spacing: 5px;
    text-shadow: 0 0 10px rgba(150,180,255,0.5);
    margin-bottom: 6px;
  }

  #countdown-timer {
    display: flex;
    gap: 14px;
    justify-content: center;
  }

  .cd-block {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .cd-value {
    font-size: 22px;
    color: #ffffff;
    text-shadow: 0 0 8px rgba(150,180,255,0.6);
  }

  .cd-unit {
    font-size: 10px;
    letter-spacing: 2px;
    color: #aab4d0;
    margin-top: 2px;
  }

  #bubble {
    position: absolute;
    top: 10px;
    left: -46px;
    width: 56px;
    height: auto;
    opacity: 0;
    transform: translateY(6px) scale(0.9);
    transition: opacity 0.35s ease, transform 0.35s ease;
    pointer-events: none;
  }
  #bubble.show {
    opacity: 1;
    transform: translateY(0px) scale(1);
  }

  #sound-btn {
    position: absolute;
    bottom: 20px;
    right: 20px;
    z-index: 5;
    background: transparent;
    border-style: solid;
    border-width: 14px 20px;
    border-image-source: url('assets/button.png');
    border-image-slice: 50 fill;
    border-image-width: 14px 20px;
    border-image-repeat: stretch;
    image-rendering: pixelated;
    color: #2c2c2c;
    font-family: 'm6x11plus', 'Courier New', monospace;
    font-size: 14px;
    padding: 4px 6px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  #sound-btn:hover { filter: brightness(0.95); }
  #sound-btn:active { filter: brightness(0.88); }
</style>
</head>
<body>

<div id="page-1">
  <div id="bg-gif"></div>

  <div id="countdown">
    <div id="countdown-label">REENCUENTRO</div>
    <div id="countdown-timer">
      <div class="cd-block">
        <span class="cd-value" id="cd-days">--</span>
        <span class="cd-unit">DÍAS</span>
      </div>
      <div class="cd-block">
        <span class="cd-value" id="cd-hours">--</span>
        <span class="cd-unit">HORAS</span>
      </div>
      <div class="cd-block">
        <span class="cd-value" id="cd-minutes">--</span>
        <span class="cd-unit">MIN</span>
      </div>
      <div class="cd-block">
        <span class="cd-value" id="cd-seconds">--</span>
        <span class="cd-unit">SEG</span>
      </div>
    </div>
  </div>

  <img id="avion" src="assets/avion.png" alt="Avión pixel art">

  <div id="avatar-wrap">
    <div id="avatar-box">
      <img id="avatar" src="assets/avatar.png" alt="Avatar Paohan">
      <img id="bubble" src="" alt="">
    </div>
    <div id="title">PAOLA Y HANDER</div>
  </div>

  <button id="sound-btn">🔇 Love Me Again</button>
</div>

<script src="script.js"></script>
</body>
</html>
